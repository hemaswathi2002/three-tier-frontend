server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

  # Security headers. nginx drops server-level add_header lines inside any location that
  # sets its own add_header, so they are repeated in the two locations below.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Hashed build files can be cached forever; index.html must always be re-checked
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always; add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always; add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
  location / { try_files $uri /index.html; }

  location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }

  # API routing: one prefix per microservice
  location /api/auth     { include /etc/nginx/snippets/proxy.conf; proxy_pass http://user-service:3001; }
  location /api/products { include /etc/nginx/snippets/proxy.conf; proxy_pass http://product-service:3002; }
  location /api/cart     { include /etc/nginx/snippets/proxy.conf; proxy_pass http://cart-service:3003; }
  location /api/wishlist { include /etc/nginx/snippets/proxy.conf; proxy_pass http://wishlist-service:3004; }
  location /api/orders   { include /etc/nginx/snippets/proxy.conf; proxy_pass http://order-service:3005; }
}
